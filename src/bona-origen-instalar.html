<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2D2D2D">
  <title>BONA origen · Instalar aplicación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #F9F7F5;
      color: #2D2D2D;
    }
    .card {
      width: min(400px, 100%);
      text-align: center;
      padding: 36px 28px 32px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid rgba(45, 45, 45, 0.08);
      box-shadow: 0 24px 60px rgba(45, 45, 45, 0.08);
    }
    .logo-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #B59A6D;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    h1 .a-lambda { color: #B59A6D; }
    p {
      font-size: 0.95rem;
      line-height: 1.55;
      color: #5c5c5c;
      max-width: 30ch;
      margin: 0 auto;
    }
    .foot {
      margin-top: 24px;
      font-size: 0.75rem;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo-wrap" aria-hidden="true">
      <svg width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#B59A6D" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>
        <circle cx="32" cy="32" r="22" fill="none" stroke="#2D2D2D" stroke-width=".8" opacity=".35"/>
        <line x1="32" y1="32" x2="32" y2="10" stroke="#2D2D2D" stroke-width="1"/>
        <line x1="32" y1="32" x2="52" y2="32" stroke="#B59A6D" stroke-width="1"/>
        <line x1="32" y1="32" x2="32" y2="54" stroke="#2D2D2D" stroke-width="1"/>
        <line x1="32" y1="32" x2="12" y2="32" stroke="#B59A6D" stroke-width="1"/>
        <circle cx="32" cy="32" r="3.5" fill="#2D2D2D"/>
      </svg>
    </div>
    <p class="eyebrow">BONA origen</p>
    <h1>Instala la aplicación<br><span class="a-lambda">BONΛ</span> origen</h1>
    <p>Este código es para emparejar un dispositivo con el sistema POS. Descarga e instala la app oficial para continuar.</p>
    <p class="foot">© BONA origen · Sistema POS</p>
  </main>
</body>
</html>
