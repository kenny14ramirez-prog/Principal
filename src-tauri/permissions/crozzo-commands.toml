[[permission]]
identifier = "allow-crozzo-http"
description = "HTTP GET/HEAD desde Rust (evita CORS en actualizaciones)"
commands.allow = ["crozzo_http_get_text", "crozzo_http_head"]

[[permission]]
identifier = "allow-crozzo-install"
description = "Instalador silencioso Windows/macOS"
commands.allow = ["install_setup_from_url", "install_dmg_from_url", "probe_platform_installer"]

[[permission]]
identifier = "allow-crozzo-dian"
description = "Consultas DIAN VPFE y adquiriente"
commands.allow = ["fetch_dian_vpfe", "fetch_dian_adquiriente"]

[[permission]]
identifier = "allow-crozzo-crm-registro"
description = "Servidor LAN registro CRM por QR"
commands.allow = [
  "crm_registro_start",
  "crm_registro_stop",
  "crm_registro_status",
  "crm_registro_drain_pending",
  "crm_registro_push_pending",
]

[[permission]]
identifier = "allow-crozzo-lan-sync"
description = "Servidor LAN multidispositivo (health, status, sync)"
commands.allow = [
  "crozzo_lan_sync_start",
  "crozzo_lan_sync_stop",
  "crozzo_lan_sync_status",
  "crozzo_lan_sync_drain_pending",
]

[[permission]]
identifier = "allow-crozzo-webview-camera"
description = "Reset permiso cámara WebView2"
commands.allow = ["cxf_reset_webview_camera_permission"]

[[permission]]
identifier = "allow-crozzo-gossip-udp"
description = "Gossip UDP offline entre tablets (broadcast/multicast)"
commands.allow = [
  "crozzo_gossip_udp_start",
  "crozzo_gossip_udp_stop",
  "crozzo_gossip_udp_send",
  "crozzo_gossip_udp_drain",
  "crozzo_gossip_udp_status",
]

[[permission]]
identifier = "allow-crozzo-lan-ws"
description = "WebSocket LAN push comandas (puerto HTTP+1)"
commands.allow = [
  "crozzo_lan_ws_start",
  "crozzo_lan_ws_stop",
  "crozzo_lan_ws_status",
  "crozzo_lan_ws_broadcast",
]

[[permission]]
identifier = "allow-crozzo-mdns"
description = "mDNS anuncio y descubrimiento caja Crozzo"
commands.allow = [
  "crozzo_mdns_start_advertise",
  "crozzo_mdns_start_browse",
  "crozzo_mdns_stop",
  "crozzo_mdns_drain_discovered",
]
