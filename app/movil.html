<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Instalar Crozzo POS</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #1e3a5f 0%, var(--bg) 55%);
      color: var(--text);
      padding: 24px 16px 40px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .wrap { width: 100%; max-width: 420px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .card h2 { font-size: 1rem; margin: 0 0 10px; }
    .card p { margin: 0 0 10px; font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid rgba(148,163,184,.35); }
    .ver { font-size: 0.78rem; color: var(--muted); margin-top: 12px; text-align: center; }
    .steps { padding-left: 1.1rem; margin: 0; font-size: 0.85rem; color: var(--muted); }
    .steps li { margin-bottom: 6px; }
    .spin { text-align: center; padding: 40px 0; color: var(--muted); }
    .badge { display: inline-block; font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; background: rgba(56,189,248,.15); color: var(--accent); margin-bottom: 8px; }
    .err { color: #fca5a5; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Crozzo POS</span>
    <h1>Instalar app móvil</h1>
    <p class="sub" id="status">Buscando la última versión…</p>
    <div id="content" class="spin">⏳</div>
    <p class="ver" id="verLine"></p>
  </div>
  <script>
(function () {
  'use strict';
  var MANIFEST = 'https://raw.githubusercontent.com/kenny14ramirez-prog/Principal/main/releases/latest.json';
  var RELEASE_BASE = 'https://github.com/kenny14ramirez-prog/Principal/releases/download';
  var RELEASE_PAGE = 'https://github.com/kenny14ramirez-prog/Principal/releases/latest';
  var PRODUCT = 'Proyecto';
  var LS_IOS_STORE = 'crozzo_ios_app_store_url_v1';

  function ua() { return navigator.userAgent || ''; }
  function isAndroid() { return /Android/i.test(ua()); }
  function isIos() { return /iPad|iPhone|iPod/i.test(ua()); }

  function semverCore(v) {
    v = String(v || '').replace(/^v/i, '');
    var m = v.match(/(\d+\.\d+\.\d+)/);
    return m ? m[1] : v;
  }

  function predictApk(ver) {
    var core = semverCore(ver);
    if (!core) return '';
    return RELEASE_BASE + '/v' + core + '/' + encodeURIComponent(PRODUCT + '_' + core + '_aarch64.apk');
  }

  function pickApkFromAssets(assets) {
    if (!Array.isArray(assets)) return '';
    var pref = assets.find(function (a) {
      var n = String(a.name || a.url || '');
      return /\.apk$/i.test(n) && (/aarch64|arm64|universal/i.test(n) || !/x86/i.test(n));
    });
    if (pref) return pref.browser_download_url || pref.url || '';
    var any = assets.find(function (a) { return /\.apk$/i.test(a.name || a.url || ''); });
    return any ? any.browser_download_url || any.url || '' : '';
  }

  function fetchReleaseAssets(ver) {
    var tag = 'v' + semverCore(ver);
    return fetch('https://api.github.com/repos/kenny14ramirez-prog/Principal/releases/tags/' + tag + '?_=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        if (!data) return { apk: predictApk(ver), page: RELEASE_PAGE };
        var apk = pickApkFromAssets(data.assets) || predictApk(ver);
        return { apk: apk, page: data.html_url || RELEASE_PAGE, version: tag };
      });
  }

  function webAppUrl() {
    try {
      var store = localStorage.getItem(LS_IOS_STORE);
      if (store && /^https?:\/\//i.test(store.trim())) return store.trim();
    } catch (_) {}
    var base = location.href.replace(/[^/]+$/, '');
    return base + 'index.html';
  }

  function headOk(url) {
    return fetch(url, { method: 'HEAD', mode: 'no-cors' }).then(function () { return true; }).catch(function () { return false; });
  }

  function verifyApk(url) {
    if (!url) return Promise.resolve('');
    return fetch(url, { method: 'HEAD' })
      .then(function (r) { return r.ok ? url : ''; })
      .catch(function () { return url; });
  }

  function setStatus(t) { document.getElementById('status').textContent = t; }
  function setVer(t) { document.getElementById('verLine').textContent = t; }

  function renderAndroid(apk, ver, page) {
    setStatus('Android detectado — descargue e instale el APK.');
    document.getElementById('content').innerHTML =
      '<div class="card">' +
      '<h2>🤖 Android (tablet / teléfono)</h2>' +
      '<p>Permita <strong>orígenes desconocidos</strong> o instale vía MDM. Tras instalar, abra Crozzo POS.</p>' +
      '<a class="btn btn-primary" href="' + apk + '" download>Descargar APK</a>' +
      '<a class="btn btn-outline" href="' + page + '">Ver release en GitHub</a>' +
      '</div>';
    setVer('Versión ' + ver);
    if (apk) {
      setTimeout(function () {
        try { location.href = apk; } catch (_) {}
      }, 800);
    }
  }

  function renderIos(url) {
    setStatus('iPhone / iPad — use la app web en Safari.');
    document.getElementById('content').innerHTML =
      '<div class="card">' +
      '<h2>🍎 iPhone / iPad</h2>' +
      '<p>No hay instalador .ipa público. Abra la app web y añádala a la pantalla de inicio:</p>' +
      '<ol class="steps">' +
      '<li>Abra el enlace en <strong>Safari</strong></li>' +
      '<li>Toque <strong>Compartir</strong> (cuadrado con flecha)</li>' +
      '<li>Elija <strong>Añadir a inicio</strong></li>' +
      '</ol>' +
      '<a class="btn btn-primary" href="' + url + '">Abrir Crozzo POS (web)</a>' +
      '</div>';
  }

  function renderDesktop(apk, ver, page, web) {
    setStatus('Elija su plataforma o escanee desde el móvil.');
    document.getElementById('content').innerHTML =
      '<div class="card"><h2>🤖 Android</h2><p>APK ARM64 para tablets.</p>' +
      '<a class="btn btn-primary" href="' + apk + '" download>Descargar APK</a></div>' +
      '<div class="card"><h2>🍎 iPhone / iPad</h2><p>App web (Safari → Añadir a inicio).</p>' +
      '<a class="btn btn-outline" href="' + web + '">Abrir app web</a></div>' +
      '<div class="card"><h2>📦 Release</h2><a class="btn btn-outline" href="' + page + '">GitHub releases</a></div>';
    setVer('Versión ' + ver);
  }

  fetch(MANIFEST + '?_=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : {}; })
    .catch(function () { return {}; })
    .then(function (data) {
      var ver = data.version || data.semver || 'v1.0.0';
      if (ver.charAt(0) !== 'v') ver = 'v' + ver;
      return fetchReleaseAssets(ver).then(function (rel) {
        return verifyApk(rel.apk).then(function (apk) {
          return { ver: ver, apk: apk || rel.apk, page: rel.page || RELEASE_PAGE, web: webAppUrl() };
        });
      });
    })
    .then(function (info) {
      if (isAndroid()) renderAndroid(info.apk, info.ver, info.page);
      else if (isIos()) renderIos(info.web);
      else renderDesktop(info.apk, info.ver, info.page, info.web);
    })
    .catch(function () {
      setStatus('No se pudo consultar la versión.');
      document.getElementById('content').innerHTML =
        '<div class="card"><p class="err">Sin conexión a GitHub. Intente más tarde.</p>' +
        '<a class="btn btn-outline" href="' + RELEASE_PAGE + '">Abrir releases</a></div>';
    });
})();
  </script>
</body>
</html>
