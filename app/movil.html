<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <meta name="apple-mobile-web-app-title" content="BONA origen" />

  <meta name="theme-color" content="#F9F7F5" />

  <title>BONA origen · Instalar aplicación</title>
  <link rel="stylesheet" href="css/CrozzoInstallPremium.css">

  <style>

    :root {

      --bo-cream: #F9F7F5;

      --bo-charcoal: #2D2D2D;

      --bo-gold: #B59A6D;

      --bo-gold-soft: rgba(181, 154, 109, 0.2);

      --bo-muted: #6b6b6b;

      --bo-ok: #3d7a5c;

    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      min-height: 100vh;

      min-height: 100dvh;

      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

      background: var(--bo-cream);

      color: var(--bo-charcoal);

      padding: max(20px, env(safe-area-inset-top)) 18px max(36px, env(safe-area-inset-bottom));

      display: flex;

      justify-content: center;

    }

    body::before {

      content: '';

      position: fixed;

      inset: 0;

      background: radial-gradient(ellipse 90% 60% at 50% 0%, var(--bo-gold-soft), transparent 60%);

      pointer-events: none;

    }

    .wrap {

      position: relative;

      z-index: 1;

      width: 100%;

      max-width: 440px;

    }

    .brand {

      text-align: center;

      margin-bottom: 22px;

      animation: bo-in 0.6s ease both;

    }

    .brand__logo {

      width: 72px;

      height: 72px;

      margin: 0 auto 12px;

      border-radius: 18px;

      background: #fff;

      border: 1px solid rgba(181, 154, 109, 0.35);

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow: 0 10px 28px rgba(45, 45, 45, 0.08);

    }

    .brand__eyebrow {

      font-size: 0.68rem;

      letter-spacing: 0.18em;

      text-transform: uppercase;

      color: var(--bo-gold);

      font-weight: 700;

    }

    .brand h1 {

      font-size: 1.35rem;

      font-weight: 700;

      margin: 6px 0 4px;

      letter-spacing: -0.02em;

    }

    .sub {

      font-size: 0.88rem;

      color: var(--bo-muted);

      line-height: 1.5;

      max-width: 34ch;

      margin: 0 auto;

    }

    .ver-pill {

      display: inline-block;

      margin-top: 12px;

      padding: 5px 14px;

      border-radius: 999px;

      background: #fff;

      border: 1px solid rgba(45, 45, 45, 0.1);

      font-size: 0.72rem;

      font-weight: 600;

      color: var(--bo-muted);

    }

    .ver-pill strong { color: var(--bo-charcoal); }

    .card {

      background: #fff;

      border: 1px solid rgba(45, 45, 45, 0.07);

      border-radius: 20px;

      padding: 20px 18px;

      margin-bottom: 14px;

      box-shadow: 0 16px 48px rgba(45, 45, 45, 0.07);

      animation: bo-in 0.65s ease 0.1s both;

    }

    .card h2 {

      font-size: 0.95rem;

      font-weight: 700;

      margin: 0 0 8px;

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .card p {

      margin: 0 0 12px;

      font-size: 0.84rem;

      color: var(--bo-muted);

      line-height: 1.5;

    }

    .btn {

      display: block;

      width: 100%;

      text-align: center;

      padding: 14px 16px;

      border-radius: 14px;

      border: none;

      font-size: 0.95rem;

      font-weight: 700;

      text-decoration: none;

      cursor: pointer;

      margin-top: 8px;

      transition: transform 0.12s ease;

    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {

      background: var(--bo-charcoal);

      color: #fff;

      box-shadow: 0 8px 20px rgba(45, 45, 45, 0.18);

    }

    .btn-outline {

      background: transparent;

      color: var(--bo-charcoal);

      border: 1px solid rgba(45, 45, 45, 0.16);

    }

    .steps {

      padding-left: 1.15rem;

      margin: 0 0 4px;

      font-size: 0.82rem;

      color: var(--bo-muted);

      line-height: 1.55;

    }

    .steps li { margin-bottom: 5px; }

    .spin {

      text-align: center;

      padding: 48px 0;

      color: var(--bo-muted);

      font-size: 0.88rem;

    }

    .spin__ring {

      width: 40px;

      height: 40px;

      margin: 0 auto 14px;

      border-radius: 50%;

      border: 2px solid rgba(181, 154, 109, 0.25);

      border-top-color: var(--bo-gold);

      animation: bo-spin 0.85s linear infinite;

    }

    @keyframes bo-spin { to { transform: rotate(360deg); } }

    @keyframes bo-in {

      from { opacity: 0; transform: translateY(12px); }

      to { opacity: 1; transform: none; }

    }

    .foot {

      text-align: center;

      font-size: 0.7rem;

      color: #9a9a9a;

      margin-top: 8px;

      letter-spacing: 0.04em;

    }

    .err { color: #b45309; font-size: 0.85rem; }

    .pair-hint {

      margin-top: 14px;

      padding: 12px 14px;

      border-radius: 12px;

      background: var(--bo-gold-soft);

      font-size: 0.78rem;

      line-height: 1.45;

      color: var(--bo-charcoal);

    }

    .pair-hint[hidden] { display: none; }

    .mo-welcome-media { margin-bottom: 14px; }

    @media (prefers-reduced-motion: reduce) {

      .brand, .card { animation: none; }

      .spin__ring { animation: none; border-top-color: var(--bo-gold); }

    }

  </style>

</head>

<body>

  <div class="wrap">

    <header class="brand">

      <div class="brand__logo" aria-hidden="true">

        <svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true">

          <circle cx="32" cy="32" r="30" fill="none" stroke="#B59A6D" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>

          <circle cx="32" cy="32" r="22" fill="none" stroke="#2D2D2D" stroke-width=".8" opacity=".35"/>

          <line x1="32" y1="32" x2="32" y2="10" stroke="#2D2D2D" stroke-width="1"/>

          <line x1="32" y1="32" x2="52" y2="32" stroke="#B59A6D" stroke-width="1"/>

          <line x1="32" y1="32" x2="32" y2="54" stroke="#2D2D2D" stroke-width="1"/>

          <line x1="32" y1="32" x2="12" y2="32" stroke="#B59A6D" stroke-width="1"/>

          <circle cx="32" cy="32" r="3.5" fill="#2D2D2D"/>

        </svg>

      </div>

      <p class="brand__eyebrow" id="moEyebrow">BONA origen</p>

      <h1 id="moTitle">Instalación de aplicación</h1>

      <p class="sub" id="moLead" hidden></p>

      <p class="sub" id="status">Verificando la última versión publicada…</p>

      <span class="ver-pill" id="verLine" hidden>Versión <strong>…</strong></span>

    </header>

    <div id="content" class="spin">

      <div class="spin__ring" aria-hidden="true"></div>

      Preparando instalador…

    </div>

    <p class="pair-hint" id="pairHint" hidden></p>

    <p class="foot">Instalación segura · Solo orígenes verificados</p>

  </div>

  <script src="infra/CrozzoInstallPremium.js"></script>
  <script>

(function () {

  'use strict';

  var MANIFEST = 'https://raw.githubusercontent.com/kenny14ramirez-prog/Principal/main/releases/latest.json';

  var RELEASE_BASE = 'https://github.com/kenny14ramirez-prog/Principal/releases/download';

  var RELEASE_PAGE = 'https://github.com/kenny14ramirez-prog/Principal/releases/latest';

  var PRODUCT = 'BONA origen';

  var LS_IOS_STORE = 'crozzo_ios_app_store_url_v1';



  function ua() { return navigator.userAgent || ''; }

  function isAndroid() { return /Android/i.test(ua()); }

  function isIos() { return /iPad|iPhone|iPod/i.test(ua()); }



  function semverCore(v) {

    v = String(v || '').replace(/^v/i, '');

    var m = v.match(/(\d+\.\d+\.\d+)/);

    return m ? m[1] : v;

  }



  function predictApk(ver) {

    var core = semverCore(ver);

    if (!core) return '';

    return RELEASE_BASE + '/v' + core + '/' + encodeURIComponent(PRODUCT + '_' + core + '_aarch64.apk');

  }



  function pickApkFromAssets(assets) {

    if (!Array.isArray(assets)) return '';

    var pref = assets.find(function (a) {

      var n = String(a.name || a.url || '');

      return /\.apk$/i.test(n) && (/aarch64|arm64|universal/i.test(n) || !/x86/i.test(n));

    });

    if (pref) return pref.browser_download_url || pref.url || '';

    var any = assets.find(function (a) { return /\.apk$/i.test(a.name || a.url || ''); });

    return any ? any.browser_download_url || any.url || '' : '';

  }



  function fetchReleaseAssets(ver) {

    var tag = 'v' + semverCore(ver);

    return fetch('https://api.github.com/repos/kenny14ramirez-prog/Principal/releases/tags/' + tag + '?_=' + Date.now())

      .then(function (r) { return r.ok ? r.json() : null; })

      .catch(function () { return null; })

      .then(function (data) {

        if (!data) return { apk: predictApk(ver), page: RELEASE_PAGE };

        var apk = pickApkFromAssets(data.assets) || predictApk(ver);

        return { apk: apk, page: data.html_url || RELEASE_PAGE, version: tag };

      });

  }



  function webAppUrl() {

    try {

      var store = localStorage.getItem(LS_IOS_STORE);

      if (store && /^https?:\/\//i.test(store.trim())) return store.trim();

    } catch (_) {}

    var base = location.href.replace(/[^/]+$/, '');

    return base + 'index.html';

  }



  function verifyApk(url) {

    if (!url) return Promise.resolve('');

    return fetch(url, { method: 'HEAD' })

      .then(function (r) { return r.ok ? url : ''; })

      .catch(function () { return url; });

  }



  function welcomeMediaHtml() {
    var P = window.CrozzoInstallPremium;
    if (!P || typeof P.renderVideoBlock !== 'function') return '';
    return '<div class="mo-welcome-media" id="moWelcomeMedia">' + P.renderVideoBlock({ compact: true }) + '</div>';
  }

  function mountWelcomeMedia() {
    var P = window.CrozzoInstallPremium;
    if (!P) return;
    if (typeof P.applyStaticLandingBrand === 'function') {
      P.applyStaticLandingBrand({ titleEl: 'moTitle', leadEl: 'moLead', eyebrowEl: 'moEyebrow', docTitle: 'Instalar aplicación' });
      var lead = document.getElementById('moLead');
      if (lead && lead.textContent) lead.hidden = false;
    }
    if (typeof P.probeBundledVideo === 'function') {
      P.probeBundledVideo(function () {
        var host = document.getElementById('moWelcomeMedia');
        if (host && typeof P.renderVideoBlock === 'function') {
          host.innerHTML = P.renderVideoBlock({ compact: true });
          if (typeof P.bindVideoPlayers === 'function') P.bindVideoPlayers(host);
        }
      });
    }
  }

  function setStatus(t) { document.getElementById('status').textContent = t; }

  function setVer(ver) {

    var el = document.getElementById('verLine');

    if (!el) return;

    el.hidden = false;

    el.innerHTML = 'Versión publicada <strong>' + ver + '</strong>';

  }



  function showPairHint() {

    var hash = (location.hash || '').replace(/^#/, '').trim();

    if (!hash) {

      try { hash = sessionStorage.getItem('crozzo_pairing_paste_hint') || ''; } catch (_) {}

    }

    if (!hash || !/^BO/i.test(hash)) return;

    var el = document.getElementById('pairHint');

    if (!el) return;

    el.hidden = false;

    el.innerHTML = '<strong>Paso siguiente:</strong> tras instalar, abra la app y escanee el QR de la caja — o pegue su código de emparejamiento en el asistente.';

  }



  function renderAndroid(apk, ver, page) {

    setStatus('Android detectado — listo para instalar.');

    document.getElementById('content').innerHTML =

      '<div class="card">' +

      welcomeMediaHtml() +

      '<h2>Instalación en Android</h2>' +

      '<p>Descargue el paquete oficial firmado. Si el sistema lo solicita, permita <strong>instalar apps de esta fuente</strong>.</p>' +

      '<ol class="steps">' +

      '<li>Descargue el APK</li>' +

      '<li>Abra el archivo e instale</li>' +

      '<li>Inicie BONA origen y empareje con la caja</li>' +

      '</ol>' +

      '<a class="btn btn-primary" href="' + apk + '" download>Descargar BONA origen</a>' +

      '<a class="btn btn-outline" href="' + page + '">Ver detalles del release</a>' +

      '</div>';

    setVer(ver);

    showPairHint();

    mountWelcomeMedia();

    if (apk) {

      setTimeout(function () {

        try { location.href = apk; } catch (_) {}

      }, 1200);

    }

  }



  function renderIos(url) {

    setStatus('iPhone / iPad — experiencia web optimizada.');

    document.getElementById('content').innerHTML =

      '<div class="card">' +

      '<h2>Instalación en iOS</h2>' +

      '<p>Abra en <strong>Safari</strong> y añada BONA origen a su pantalla de inicio para una experiencia tipo app nativa.</p>' +

      '<ol class="steps">' +

      '<li>Abra el enlace en Safari</li>' +

      '<li>Toque Compartir → Añadir a inicio</li>' +

      '<li>Inicie sesión o empareje con la caja</li>' +

      '</ol>' +

      '<a class="btn btn-primary" href="' + url + '">Abrir BONA origen</a>' +

      '</div>';

    showPairHint();

  }



  function renderDesktop(apk, ver, page, web) {

    setStatus('Seleccione su plataforma o escanee desde el móvil.');

    document.getElementById('content').innerHTML =

      '<div class="card">' + welcomeMediaHtml() + '<h2>Android (tablet)</h2><p>APK ARM64 para dispositivos de campo.</p>' +

      '<a class="btn btn-primary" href="' + apk + '" download>Descargar APK</a></div>' +

      '<div class="card"><h2>iPhone / iPad</h2><p>App web progresiva vía Safari.</p>' +

      '<a class="btn btn-outline" href="' + web + '">Abrir aplicación web</a></div>' +

      '<div class="card"><h2>Release oficial</h2>' +

      '<a class="btn btn-outline" href="' + page + '">GitHub releases</a></div>';

    setVer(ver);

    mountWelcomeMedia();

  }



  fetch(MANIFEST + '?_=' + Date.now())

    .then(function (r) { return r.ok ? r.json() : {}; })

    .catch(function () { return {}; })

    .then(function (data) {

      var ver = data.version || data.semver || 'v1.0.0';

      if (ver.charAt(0) !== 'v') ver = 'v' + ver;

      return fetchReleaseAssets(ver).then(function (rel) {

        return verifyApk(rel.apk).then(function (apk) {

          return { ver: ver, apk: apk || rel.apk, page: rel.page || RELEASE_PAGE, web: webAppUrl() };

        });

      });

    })

    .then(function (info) {

      if (isAndroid()) renderAndroid(info.apk, info.ver, info.page);

      else if (isIos()) renderIos(info.web);

      else renderDesktop(info.apk, info.ver, info.page, info.web);

    })

    .catch(function () {

      setStatus('No se pudo verificar la versión en este momento.');

      document.getElementById('content').innerHTML =

        '<div class="card"><p class="err">Sin conexión a GitHub. Verifique su red e intente de nuevo.</p>' +

        '<a class="btn btn-outline" href="' + RELEASE_PAGE + '">Abrir releases oficiales</a></div>';

    });

})();

  </script>

</body>

</html>
